<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d4735"/>
      <stop offset="50%" style="stop-color:#1a6b4a"/>
      <stop offset="100%" style="stop-color:#0d4735"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4a017"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b7a50"/>
      <stop offset="50%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#1b7a50"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="512" cy="512" r="512" fill="url(#bg)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="512" cy="512" r="450" fill="none" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Islamic geometric pattern corners -->
  <!-- Top -->
  <path d="M512 60 L530 90 L512 110 L494 90 Z" fill="url(#gold)"/>
  <!-- Bottom -->
  <path d="M512 964 L530 934 L512 914 L494 934 Z" fill="url(#gold)"/>
  <!-- Left -->
  <path d="M60 512 L90 494 L110 512 L90 530 Z" fill="url(#gold)"/>
  <!-- Right -->
  <path d="M964 512 L934 494 L914 512 L934 530 Z" fill="url(#gold)"/>
  
  <!-- Book - Back cover -->
  <rect x="280" y="250" width="400" height="520" rx="15" ry="15" fill="#145a3a" stroke="url(#gold)" stroke-width="4"/>
  
  <!-- Book - Spine -->
  <rect x="280" y="250" width="40" height="520" rx="10" ry="0" fill="#0f4a2e" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Book - Front cover -->
  <rect x="300" y="240" width="400" height="520" rx="15" ry="15" fill="url(#bookCover)" stroke="url(#gold)" stroke-width="4"/>

  <!-- Book - Inner decorative border -->
  <rect x="330" y="270" width="340" height="460" rx="10" ry="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="340" y="280" width="320" height="440" rx="8" ry="8" fill="none" stroke="url(#gold)" stroke-width="1"/>

  <!-- Decorative top arch -->
  <path d="M400 300 Q500 260 600 300" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <path d="M410 310 Q500 275 590 310" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  
  <!-- Star and crescent at top of book -->
  <circle cx="500" cy="360" r="35" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="510" cy="355" r="28" fill="url(#bookCover)"/>
  <polygon points="530,340 534,352 547,352 536,360 540,372 530,364 520,372 524,360 513,352 526,352" fill="url(#gold)"/>
  
  <!-- Arabic-style Quran text (القرآن) - stylized -->
  <text x="500" y="460" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="url(#gold)" direction="rtl">القرآن</text>
  
  <!-- "Holy Quran" English text -->
  <text x="500" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="url(#gold)" letter-spacing="4">HOLY QURAN</text>
  
  <!-- Decorative line separator -->
  <line x1="380" y1="545" x2="620" y2="545" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="500" cy="545" r="5" fill="url(#gold)"/>
  <circle cx="460" cy="545" r="3" fill="url(#gold)"/>
  <circle cx="540" cy="545" r="3" fill="url(#gold)"/>
  
  <!-- الكريم text -->
  <text x="500" y="590" text-anchor="middle" font-family="serif" font-size="40" fill="url(#gold)" direction="rtl">الكريم</text>

  <!-- Decorative bottom arch -->
  <path d="M400 680 Q500 720 600 680" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <path d="M410 670 Q500 705 590 670" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  
  <!-- Book pages visible from side -->
  <line x1="300" y1="270" x2="300" y2="740" stroke="#f5f0e1" stroke-width="3"/>
  <line x1="303" y1="272" x2="303" y2="738" stroke="#e8e0c8" stroke-width="1"/>
  <line x1="296" y1="272" x2="296" y2="738" stroke="#e8e0c8" stroke-width="1"/>
  
  <!-- Subtle glow effect -->
  <circle cx="500" cy="440" r="120" fill="url(#gold)" opacity="0.05"/>
</svg>
