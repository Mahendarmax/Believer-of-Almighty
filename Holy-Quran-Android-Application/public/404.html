<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holy Quran | القرآن الكريم</title>
  <script>
    // GitHub Pages SPA redirect: convert path to hash route
    var seg = location.pathname.split('/').filter(Boolean);
    var repo = seg.length > 0 ? '/' + seg[0] + '/' : '/';
    var path = seg.slice(1).join('/');
    if (path) {
      location.replace(repo + '#/' + path + location.search);
    } else {
      location.replace(repo);
    }
  </script>
</head>
<body></body>
</html>
