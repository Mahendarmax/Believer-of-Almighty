name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Fix bin permissions
        run: chmod -R +x node_modules/.bin

      - name: Build web app
        run: npx vite build

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install icon tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate app icons
        run: bash scripts/generate-icons.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Holy-Quran.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Quran
          path: android/app/build/outputs/apk/debug/Holy-Quran.apk
          retention-days: 30
