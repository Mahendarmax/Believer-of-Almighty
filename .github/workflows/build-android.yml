name: Build Android APK

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'Holy-Quran-Android-Application/**'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Holy-Quran-Android-Application

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Ensure assets directory exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install icon tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate app icons
        run: bash scripts/generate-icons.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: Holy-Quran-Android-Application/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Holy-Quran.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Quran
          path: Holy-Quran-Android-Application/android/app/build/outputs/apk/debug/Holy-Quran.apk
          retention-days: 30

      - name: Delete previous releases and tags
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all releases and delete them along with their tags
          gh release list --limit 50 --json tagName -q '.[].tagName' | while read tag; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: holy-quran-latest
          name: "Holy Quran APK - Latest"
          body: |
            Latest release from Holy-Quran-Android-Application.
            Build: ${{ github.run_number }} | Commit: ${{ github.sha }}
          files: Holy-Quran-Android-Application/android/app/build/outputs/apk/debug/Holy-Quran.apk
          draft: false
          prerelease: false


